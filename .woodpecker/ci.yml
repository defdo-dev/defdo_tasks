---
# defdo_tasks Woodpecker CI — branch/PR pipeline (companion to
# .woodpecker/release.yml, which is tag-only).
#
# Validates a branch or PR WITHOUT publishing: format, compile, and the full
# test suite. This package has NO database dependency — its tests drive gh/git
# through injected runners and never touch Postgres — so there is no service
# block and no PGHOST contract, unlike the sibling library CIs.
#
# ─── Pipeline rule: compile ONCE, fan out ──────────────────────────────────
# All steps of a workflow share the same workspace volume, so `deps/` and
# `_build/` written by the `compile` step persist into every step that
# `depends_on` it. Downstream steps therefore NEVER recompile — they mount the
# warm `_build` and run their check straight away. `depends_on: [compile]`
# lets `format` and `test` run in parallel once the single compile finishes.
#
# Runs on the DOCKER/kubernetes agent (`platform: linux/amd64`). The label is
# REQUIRED: without it jobs can land on the local (exec) agent, which tries to
# run the `image:` string as a host binary and dies with
# `exec: "<image>": executable file not found`.

labels:
  platform: linux/amd64

when:
  - event: [push, pull_request]
    branch: main
  - event: manual
  - event: cron

steps:
  - name: compile
    image: elixir:1.19.5
    environment:
      HEX_ORG_TOKEN:
        from_secret: hex_org_token
      MIX_ENV: test
    commands:
      - |
        set -e
        HEX_ORG_NAME="defdo"
        export HEX_ORG_NAME HEX_ORG_TOKEN

        mix do local.hex --force + local.rebar --force

        if [ -n "$HEX_ORG_TOKEN" ]; then
          mix hex.organization auth "$HEX_ORG_NAME" --key "$HEX_ORG_TOKEN"
        fi

        mix deps.get
        # This repo's whole pipeline runs under MIX_ENV=test (set above), so
        # one compile warms the only _build tree every dependent step needs.
        mix compile --warnings-as-errors

  - name: format
    image: elixir:1.19.5
    depends_on: [compile]
    environment:
      MIX_ENV: test
    commands:
      - |
        set -e
        # ~/.mix does NOT travel with the workspace — reinstall hex/rebar.
        mix do local.hex --force + local.rebar --force
        # Reuses _build/deps from `compile` — no recompile.
        mix format --check-formatted

  - name: test
    image: elixir:1.19.5
    depends_on: [compile]
    environment:
      MIX_ENV: test
    commands:
      - |
        set -e
        mix do local.hex --force + local.rebar --force
        # _build/test is already warm from `compile`; mix test just runs.
        mix test
